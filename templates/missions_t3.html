
<!-- Displays the third tier of missions -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='mission_style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='missions.js') }}" defer></script>
    <title>Missions Tier 3</title>
</head>

<body>
    <div id="topbar">
        <a href="map.html" id="backbutton">< Back</a>
        <div id="tierselect">
            <a href="missions_t1" class="tierbutton" id="tier1">Tier 1</a>
            <a href="missions_t2" class="tierbutton" id="tier2">Tier 2</a>
            <a href="missions_t3" class="tierbutton" id="tier3">Tier 3</a>
        </div>

    </div>

    <div id="missiondisplay">
        {% for mission in missions %}
        <div class="mission" name="{{ mission.id }}">
            <div class="icons">
                <a class="editbutton" href="edit_mission?id={{mission.id}}"><svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#000000"><path d="M202.63-202.87h57.24l374.74-374.74-56.76-57-375.22 375.22v56.52Zm-90.76 91v-185.3l527.52-526.76q12.48-11.72 27.7-17.96 15.21-6.24 31.93-6.24 16.48 0 32.2 6.24 15.71 6.24 27.67 18.72l65.28 65.56q12.48 11.72 18.34 27.56 5.86 15.83 5.86 31.79 0 16.72-5.86 32.05-5.86 15.34-18.34 27.82L297.65-111.87H111.87Zm642.87-586.39-56.24-56.48 56.24 56.48Zm-148.89 92.41-28-28.76 56.76 57-28.76-28.24Z"/></svg></a>
                <div class="trophy">
                    <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#FFFFFF"><path d="M480-518q35.67 0 60.5-24.83 24.83-24.84 24.83-60.5 0-35.67-24.83-60.5-24.83-24.84-60.5-24.84t-60.5 24.84q-24.83 24.83-24.83 60.5 0 35.66 24.83 60.5Q444.33-518 480-518ZM290.41-110.91v-75.76h151.71v-131.79q-52.49-11.55-93.52-45.31-41.03-33.75-58.74-84.02-79.11-5.62-133.65-62.04-54.54-56.42-54.54-135.5V-688q0-31.73 22.09-53.82t53.82-22.09h96v-85.34h413v85.34h96q31.49 0 53.62 22.09T858.33-688v42.67q0 79.08-54.54 135.5t-133.65 62.04q-17.71 50.27-58.74 84.02-41.03 33.76-93.52 45.31v131.79h151.71v75.76H290.41Zm-16.83-415.76V-688h-96v42.67q0 42.66 27 75.16t69 43.5Zm413 0q41.84-11 68.92-43.5t27.08-75.16V-688h-96v161.33Z"/></svg>
                </div>
            </div>
            <div class="missiontext" name="{{ mission.id }}">
                <h3>Mission {{mission.id}}</h3>
                <p>{{mission.question}}</p>
            </div>
        </div>
        {% endfor %}

        
    </div>

</body>
</html>
